name: Deploy

# Every push to main is tested, then deployed:
#   1. database migrations + Edge Function → Supabase
#   2. static website → Cloudflare Pages (direct upload, so it never uses
#      Cloudflare's build minutes)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy halfway

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  supabase:
    name: Supabase — migrations & functions
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Session pooler (IPv4). GitHub runners can't reach the IPv6-only direct host.
      DB_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply database migrations
        run: supabase db push --include-all --db-url "$DB_URL"
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-booking --project-ref "$PROJECT_REF"
          supabase functions deploy publish-site --project-ref "$PROJECT_REF"
          supabase functions deploy invite-staff --project-ref "$PROJECT_REF"
          supabase functions deploy notify --project-ref "$PROJECT_REF" --no-verify-jwt

  website:
    name: Cloudflare Pages — website
    needs: supabase
    # Skipped until the Cloudflare account is set up (docs/SETUP.md §3–4).
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.PUBLIC_VAPID_PUBLIC_KEY }}
      - name: Create the Pages project on first deploy (no-op afterwards)
        run: npx --yes wrangler@4 pages project create "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
