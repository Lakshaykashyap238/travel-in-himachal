# Supabase CLI configuration (local development + `supabase config push`).
# Hosted-project settings marked ⚠ must match the dashboard — see docs/SETUP.md.
project_id = "travel-in-himachal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false   # catalogue data ships as a migration, not a seed

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "2MiB"   # photos are compressed in the browser to ~200 KB first

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/admin"]
jwt_expiry = 3600
# ⚠ Only the owner adds staff. Nobody can sign themselves up.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

# ⚠ Two-factor authentication with an authenticator app for staff.
[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[functions.create-booking]
enabled = true
verify_jwt = true   # the website sends the public anon key
import_map = "./functions/create-booking/deno.json"

[functions.publish-site]
enabled = true
verify_jwt = true   # must be a logged-in user; the database checks it is the owner
import_map = "./functions/publish-site/deno.json"

[functions.invite-staff]
enabled = true
verify_jwt = true   # logged-in owner only (checked again in the database)
import_map = "./functions/invite-staff/deno.json"

[functions.notify]
enabled = true
verify_jwt = false  # called by the database with a shared secret header, not a user login
import_map = "./functions/notify/deno.json"
